name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_ntfy:
        description: "Envoyer une notification de test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Notification de test
        if: ${{ inputs.test_ntfy }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sS -H "Title: uptime test" -H "Tags: test_tube" \
            -d "La sonde GitHub Actions peut vous joindre." "https://ntfy.sh/$NTFY_TOPIC"

      - name: Sonde
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash check.sh

      - name: Enregistrer l'état et maintenir le workflow actif
        run: |
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          # GitHub désactive les crons d'un repo public après 60 jours sans activité.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%FT%TZ > state/.keepalive
          fi
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "état uptime $(date -u +%FT%TZ)"
            git push
          fi
